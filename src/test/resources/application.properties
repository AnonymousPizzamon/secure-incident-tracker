# test classpath copy SHADOWS src/main/resources/application.properties (spring loads the
# first application.properties it finds, no merge), so tests restate what they need here.
# https://docs.spring.io/spring-boot/reference/features/external-config.html

# throwaway secret so tests don't depend on a JWT_SECRET env var. not a real secret,
# safe to commit. HS256 needs 32+ bytes.
jwt.secret=test-secret-not-used-in-production-0123456789-0123456789
jwt.expiration=3600000

# same local postgres as the app, password still from env so nothing real is committed
spring.datasource.url=jdbc:postgresql://localhost:5432/app_db
spring.datasource.username=app_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# same as main config, this file shadows it so it must be restated
spring.jpa.open-in-view=false
