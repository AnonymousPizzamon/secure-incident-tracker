
spring.application.name=log-monitoring-app

spring.datasource.url=jdbc:postgresql://localhost:5432/app_db
spring.datasource.username=app_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# don't hold a db connection open for the whole request, responses are mapped to dtos in the service layer
# https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

# 24 hrs in milliseconds
jwt.expiration=86400000
